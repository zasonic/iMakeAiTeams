appId: com.imakeaiteams.app
productName: iMakeAiTeams
copyright: Copyright © 2026 iMakeAiTeams
asar: true

directories:
  output: dist
  buildResources: branding

files:
  - out/**/*
  - package.json
  - "!**/*.{md,map,ts,tsx}"
  - "!**/{tsconfig*,*.config.*,.eslintrc*}"

extraResources:
  - from: branding/sidecar-bundle
    to: backend
    filter: ["**/*"]
  - from: branding/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  icon: branding/icon.png
  artifactName: "${productName}-Setup-${version}.${ext}"
  # publisherName must match the CN of the signing certificate exactly.
  # electron-updater verifies the downloaded installer's publisher against
  # this value, so it MUST be set only when a real code-signing certificate
  # is wired in (win.certificateFile / certificateSubjectName / CSC_LINK).
  # Otherwise auto-update will reject every release as publisher-mismatched.
  # Re-add once a cert is in place.
  # publisherName:
  #   - iMakeAiTeams

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: iMakeAiTeams
  uninstallDisplayName: iMakeAiTeams
  # Intentionally false: a "Repair" reinstall or a version-bump upgrade
  # MUST preserve conversations, settings, and the keyring sentinel.
  # branding/installer.nsh surfaces the data locations to the user so
  # they can clean up manually if they want a from-scratch removal.
  deleteAppDataOnUninstall: false
  include: branding/installer.nsh

# Auto-update dependency:
#
# electron-updater on every installed client polls
# https://github.com/zasonic/imakeaiteams/releases (per the values below).
# If this repo is renamed, transferred, or made private, deployed clients
# silently lose auto-update — there is no runtime fallback for users on
# pre-migration versions, so they would have to download manually.
#
# Rotation procedure:
#   1. Cut a final release on the OLD repo with a banner notifying users.
#   2. Update owner/repo here and ship the migration release on the OLD
#      repo so clients see it BEFORE they switch.
#   3. Subsequent releases go to the NEW repo.
publish:
  - provider: github
    owner: zasonic
    repo: imakeaiteams
    releaseType: release
