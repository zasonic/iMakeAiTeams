name: security-bench

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job commits back to main with [skip ci] so it does not retrigger
# itself. ``contents: write`` is required for that push.
permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the full history so the commit-back step can fast-forward
          # main without surprises.
          fetch-depth: 0
          token: ${{ secrets.BENCH_PUSH_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + bench dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-bench.txt

      - name: Run AgentDojo — workspace
        run: |
          python -m backend.tests.agentdojo.run_suites \
            --suite workspace --output benchmarks/workspace.json

      - name: Run AgentDojo — slack
        run: |
          python -m backend.tests.agentdojo.run_suites \
            --suite slack --output benchmarks/slack.json

      - name: Run AgentDojo — banking
        run: |
          python -m backend.tests.agentdojo.run_suites \
            --suite banking --output benchmarks/banking.json

      - name: Run AgentDojo — travel
        run: |
          python -m backend.tests.agentdojo.run_suites \
            --suite travel --output benchmarks/travel.json

      - name: Generate BENCHMARKS.md
        run: |
          python build-scripts/generate_benchmarks_md.py \
            --benchmarks-dir benchmarks \
            --thresholds benchmarks/thresholds.json \
            --output BENCHMARKS.md

      # Commit the results + regenerated markdown back into main. ``[skip ci]``
      # in the message keeps GitHub from retriggering the workflow on its own
      # push. If nothing changed (deterministic-where-possible — utility/ASR
      # often match the previous run exactly), git commit exits non-zero and
      # we swallow it so the workflow still goes green.
      - name: Commit results back to main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add benchmarks/*.json BENCHMARKS.md
          if git diff --staged --quiet; then
            echo "No bench delta — nothing to commit."
            exit 0
          fi
          git commit -m "bench: refresh AgentDojo results [skip ci]"
          git push origin HEAD:main
